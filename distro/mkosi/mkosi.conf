#
# Nimbus OS 1.0 (Cirrus) - mkosi image definition (mkosi v25 syntax).
# Build with: make -C distro image   (or: cd distro/mkosi && mkosi -f build)

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
ImageId=nimbus
ImageVersion=1.0
OutputDirectory=../out/image

[Build]
# Custom kernel .debs (linux-image-*-nimbus) are mounted at $SRCDIR/kernel
# and installed by mkosi.postinst.chroot with dpkg -i, since Packages=
# does not accept globs.
BuildSources=../out/kernel:kernel

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=quiet splash
Hostname=nimbus
Locale=en_US.UTF-8
Timezone=UTC
ExtraTrees=../rootfs:/
# Local apt repo built from the kernel debs so their dependencies resolve.
PackageDirectories=../out/kernel

# Base system
Packages=
        systemd
        systemd-boot
        systemd-resolved
        udev
        dbus
        sudo
        kmod
        initramfs-tools
        linux-base
        locales
        ca-certificates
        network-manager

# Desktop: KDE Plasma 6 on Wayland with SDDM
Packages=
        plasma-desktop
        plasma-workspace
        kwin-wayland
        sddm
        sddm-theme-breeze
        plasma-nm
        plasma-pa
        bluedevil
        powerdevil
        kscreen
        plasma-discover
        xdg-desktop-portal-kde
        pipewire-audio
        wireplumber

# Applications
Packages=
        dolphin
        konsole
        kate
        ark
        okular
        gwenview
        kde-spectacle
        firefox-esr
        flatpak

# Branding, boot splash, fonts, icons, installer
Packages=
        plymouth
        papirus-icon-theme
        fonts-inter
        fonts-jetbrains-mono
        breeze-cursor-theme
        breeze-gtk-theme
        kde-config-gtk-style
        xsettingsd
        qml6-module-qtquick
        qml6-module-qtquick-controls
        qml6-module-qtquick-templates
        qml6-module-qtquick-window
        qml6-module-qtqml-workerscript
        qml6-module-qtquick-effects
        qt6-svg-plugins
        calamares
        calamares-settings-debian
