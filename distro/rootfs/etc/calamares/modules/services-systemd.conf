# systemd units enabled on the installed system.
---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: false
  - name: "sddm.service"
    action: "enable"
    mandatory: false
  - name: "bluetooth.service"
    action: "enable"
    mandatory: false
