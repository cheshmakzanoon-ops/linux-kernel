# User account creation for Nimbus OS.
---
defaultGroups:
  - sudo
  - audio
  - video
  - netdev
  - plugdev
  - lpadmin
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false

passwordRequirements:
  nonempty: true
  minLength: -1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, nimbus ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "nimbus-${cpu}"
  forbidden_names: [ localhost ]
