# Partitioning defaults for Nimbus OS (UEFI + systemd-boot only).
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 1024MiB
  minimumSize: 512MiB
  label: "EFI"
# Legacy keys, kept for older Calamares releases.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 1024M
efiSystemPartitionName: "EFI"

userSwapChoices:
  - none
  - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
partitionLayout:
  - name: "nimbus-root"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%

initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs" ]
