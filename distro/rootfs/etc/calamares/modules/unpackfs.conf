# Copy the running live root filesystem to the target (rsync-style).
# sourcefs "file" copies a directory tree; destination "" is the target root.
---
unpack:
  - source: "/"
    sourcefs: "file"
    destination: ""
    exclude:
      - "/proc/*"
      - "/sys/*"
      - "/dev/*"
      - "/run/*"
      - "/tmp/*"
      - "/mnt/*"
      - "/media/*"
      - "/boot/efi/*"
      - "/efi/*"
      - "/lost+found"
      - "/swapfile"
